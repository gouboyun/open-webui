kind: pipeline
type: docker
name: build


volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: dockerconfig
    host:
      path: /root/.docker/
  - name: nodemodule
    host:
      path: /data/docker-drone-runner-volume/${DRONE_REPO_NAMESPACE}-${DRONE_REPO_NAME}

image_pull_secrets:
- dockerconfig

trigger:
  branch:
    - main
    - nanyou
  event:
    exclude:
      - promote
      - tag

environment:
  APP_IMAGE: registry.cn-wulanchabu.aliyuncs.com/gouboyun/${DRONE_REPO_NAMESPACE}-${DRONE_REPO_NAME}:${CI_COMMIT_BRANCH}
  APP_IMAGE_IID: registry.cn-wulanchabu.aliyuncs.com/gouboyun/${DRONE_REPO_NAMESPACE}-${DRONE_REPO_NAME}:${CI_COMMIT_BRANCH}-${DRONE_BUILD_NUMBER}


steps:
  - name: build-frontend
    image: registry.cn-wulanchabu.aliyuncs.com/gouboyun-pub/node:22-alpine3.20
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: dockerconfig
        path: /root/.docker/
      - name: nodemodule
        path: /drone/src/node_modules
    commands:
      - npm config set registry https://registry.npmmirror.com
      - npm ci
      - npm run build

  - name: build-docker
    image: docker:24.0.7-git
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: dockerconfig
        path: /root/.docker/
    commands:
      # - docker build -t ${DRONE_REPO_NAMESPACE}-${DRONE_REPO_NAME}:${CI_COMMIT_BRANCH} .
      - docker buildx ls
      - docker buildx build --no-cache -f Dockerfile-nanyou --platform linux/amd64,linux/arm64 -t $APP_IMAGE -t $APP_IMAGE_IID --push .
